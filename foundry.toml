# Foundry 1.7.1 (pinned via the @foundry-rs/* npm packages). Compiler and dependencies are pinned.
[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.30"
# Robinhood Chain (Arbitrum Orbit) runs Cancun: verified tokens there (e.g. TORCH, compiled for cancun) execute
# Cancun opcodes on mainnet. Fork tests must use the same rules or such tokens fail with NotActivated.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
# Legacy contracts and fixtures stay in the repository but are not part of the new protocol build.
skip = [
  "contracts/RixorConvictionVault.sol",
  "contracts/RixorSavings.sol",
  "contracts/testnet/*",
  "contracts/test/*",
]
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 1000
seed = "0x52697a6f72"

[profile.default.invariant]
runs = 256
depth = 200
fail_on_revert = true
call_override = false

[fmt]
line_length = 120
